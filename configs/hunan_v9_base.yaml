_base_: hunan_e4.yaml

# v9: sequential 24 h runoff+routing warm-up + observation state assimilation
# + explicit-state Delta-Z head. E1--E4 share this exact code path; YAML switches
# only runoff/routing physics.
model_version: v9

data:
  # v8 tensors inherit the frozen v7 hydrologic-event domain.
  dataset_type: event
  # Formal Hunan research experiments use the observed target-period rainfall
  # already stored in the frozen tensors. This is a hindcast/known-forcing
  # experiment, not an operational persistence-rain forecast.
  future_rainfall_mode: observed_hindcast

# Current Hunan tensors are hourly. Durations and cadences are physical units,
# not an assumption that one model step always equals one hour.
#
# Frozen time-bin contract:
# - Step11 rain labelled t is accumulated over [t, t+dt).
# - Hourly Q/Z labelled t is one retained representative observation from that
#   labelled hour (selected upstream by completeness/fetch-time rules).
# - Targets use the next labelled hourly bins.
# No whole-hour tensor shift is applied. The old machine-readable
# hydro_hour_bin_anchor token is kept for checkpoint/runtime compatibility; it
# must not be interpreted as proof that every retained Q/Z value is exactly at
# the end of the hour.
temporal:
  history_duration_seconds: 86400
  forecast_duration_seconds: 21600
  forcing_step_seconds: 3600
  target_step_seconds: 3600
  rain_interval_anchor: interval_start
  hydro_hour_bin_anchor: start_label_last_observation_within_bin
  forecast_origin_anchor: end_of_last_history_bin

state_initialization:
  enabled: true
  mode: sequential_warmup

warmup:
  enabled: true
  initial_state: static_prior

# Physics warm-up provides the prior state. Sparse Q/Z history then performs a
# forecast-origin analysis. Observation context is propagated to the nearest
# upstream-controlled units. Q-origin residual mass is distributed by
# incremental area and can add/remove runoff and channel storage, so water that
# entered before the 24 h warm-up can be restored instead of merely multiplying
# an almost-zero state.
state_correction:
  enabled: true
  mode: mass_aware_upstream_analysis_after_warmup
  use_qz_history: true
  propagate_upstream: true
  correct_channel_storage: true
  additive_storage_from_q_residual: true
  hidden_residual_scale: 0.25
  storage_log_scale: 0.35
  max_additive_storage_hours: 6.0

z_head:
  mode: explicit_state_mlp
  incremental_output: true
  detach_hydraulic_features: true
  use_z0: true
  use_recent_trend: true
  trend_windows_seconds: [3600, 10800, 21600]
  use_q_features: true
  use_channel_state: true

loss:
  # Q and Z share hydrologic context but no province-wide monotonic Q-Z law.
  qz_consistency_weight: 0.0

training:
  epochs: 100
  patience: 100
  early_stopping: false
