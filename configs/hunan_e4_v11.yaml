# Formal E4 V11: V10 architecture + 72 h antecedent rainfall state + event-balanced TRAIN.
model_version: v11
seed: 42
runoff_mode: water_balance_lstm
routing_mode: kinematic_wave_gnn
# Primary physical rainfall warm-up length.
history_length: 72
# Sparse Q/Z assimilation deliberately remains short to avoid a longer station-history shortcut.
observation_history_length: 24
forecast_horizon: 6
node_static_dim: 10
edge_static_dim: 2
hidden_dim: 32
device: auto
gpu_id: 0
batch_size: 16
gradient_accumulation_steps: 1
amp: false
gradient_checkpointing: false
num_workers: 0
pin_memory: false
debug_mode: false
debug_max_batches: 4

data:
  mode: hunan
  dataset_type: event
  dataset_root: _model_dataset_v11_72h_event_balanced
  graph_id: null
  target_variable: Q
  strict_validation: true
  use_observation_masks: true
  future_rainfall_mode: observed_hindcast
  train_split: TRAIN
  validation_split: VALIDATION
  test_split: TEST

temporal:
  rain_history_duration_seconds: 259200
  observation_history_duration_seconds: 86400
  forecast_duration_seconds: 21600
  forcing_step_seconds: 3600
  target_step_seconds: 3600
  rain_interval_anchor: interval_start
  hydro_hour_bin_anchor: start_label_last_observation_within_bin
  forecast_origin_anchor: end_of_last_history_bin

state_initialization:
  enabled: true
  mode: sequential_warmup
warmup:
  enabled: true
  initial_state: static_prior
  rainfall_history_hours: 72
  observation_history_hours: 24
state_correction:
  enabled: true
  mode: v8_history_residual_after_warmup
  use_qz_history: true
  qz_history_hours: 24
  propagate_upstream: true
  correct_channel_storage: true
  additive_storage_from_q_residual: true
  hidden_residual_scale: 0.25
  storage_log_scale: 0.35
  max_additive_storage_hours: 6.0

stage_output:
  enabled: true
  method: train_only_station_linear_rating
  min_unique_train_pairs: 20
  require_all_outlet_stations: true
  origin_residual_correction: true
  q0_source: final_history_bin_observed_if_available_else_assimilated_model
  z0_source: final_history_bin_observation_only
  allow_backward_z_search: false

physical_bounds:
  width: [2.0, 80.0]
  manning_n: [0.015, 0.12]
solver:
  dx: 1000.0
  cfl: 0.8
  integration_scheme: backward_euler
  implicit_iterations: 8
  implicit_residual_tolerance: 1.0e-5
  minimum_slope: 1.0e-6
  minimum_length: 10.0
  seconds_per_step: 3600.0

loss:
  mode: q_only_high_flow
  q_scale_mode: per_station
  q_scale_floor_m3s: 1.0
  q_point_weight: 1.0
  q_high_flow_weight: 0.25
  q_volume_weight: 0.25
  high_flow_lower_quantile: 0.80
  high_flow_upper_quantile: 0.99
  high_flow_max_multiplier: 3.0

validation_selection:
  mode: val_loss

optimizer:
  name: adamw
  lr: 0.001
  weight_decay: 1.0e-5

train_sampling:
  enabled: true
  mode: event_balanced_phase_stratified
  origins_per_event: 8
  phase_quota: 2
  phases: [LOW, RISING, PEAK, RECESSION]

hyperparameter_optimization:
  enabled: false
training:
  epochs: 100
  patience: 100
  early_stopping: false
  gradient_clip: 1.0
  checkpoint: outputs/hunan_e4_v11_best.pt
  final_checkpoint: outputs/hunan_e4_v11_final.pt
  log_csv: outputs/hunan_e4_v11_train.csv
