seed: 42
runoff_mode: water_balance_lstm
routing_mode: kinematic_wave_gnn
history_length: 12
forecast_horizon: 6
dynamic_dim: 4
node_static_dim: 3
edge_static_dim: 2
hidden_dim: 32
device: auto
gpu_id: 0
batch_size: 4
gradient_accumulation_steps: 1
amp: false
gradient_checkpointing: false
num_workers: 0
pin_memory: false
debug_mode: true
debug_num_events: 16
debug_max_batches: 4
data:
  mode: synthetic
  dataset_root: null
  graph_id: null
  target_variable: BOTH
  normalize_dynamic: false
  strict_validation: true
  use_observation_masks: false
  future_rainfall_mode: observed_hindcast
  train_split: TRAIN
  validation_split: VALIDATION
  test_split: TEST
physical_bounds:
  width: [2.0, 80.0]
  manning_n: [0.015, 0.12]
solver:
  dx: 1000.0
  cfl: 0.8
  integration_scheme: backward_euler
  implicit_iterations: 8
  implicit_residual_tolerance: 1.0e-5
  minimum_slope: 1.0e-6
  minimum_length: 10.0
  seconds_per_step: 3600.0
loss_weights: {discharge: 2.0, water_level: 1.0}
loss:
  # legacy完整保留原始 2*Q Huber + 1*Z Huber；multitask由新配置显式开启。
  mode: legacy
  discharge_weight: 2.0
  water_level_weight: 1.0
  q_point_weight: 1.0
  q_peak_weight: 0.25
  q_volume_weight: 0.25
  z_level_weight: 1.0
  z_slope_weight: 0.25
validation_selection:
  mode: val_loss
  q_nse_weight: 0.35
  q_kge_weight: 0.15
  q_peak_weight: 0.20
  q_volume_weight: 0.10
  z_level_weight: 0.10
  z_slope_weight: 0.10
  efficiency_clip_min: -1.0
  efficiency_clip_max: 1.0
hyperparameter_optimization:
  enabled: false
  n_trials: 40
  output_dir: outputs/hpo_e4_multitask_v1
  sampler: {name: tpe, seed: 42}
  pruner:
    name: median
    n_startup_trials: 5
    n_warmup_steps: 10
    interval_steps: 1
  search_space:
    learning_rate: {type: log_float, low: 1.0e-4, high: 2.0e-3}
    weight_decay: {type: log_float, low: 1.0e-6, high: 1.0e-3}
    hidden_dim: {type: categorical, choices: [32, 64, 96]}
    q_peak_weight: {type: log_float, low: 0.05, high: 1.0}
    q_volume_weight: {type: log_float, low: 0.05, high: 1.0}
    z_slope_weight: {type: log_float, low: 0.05, high: 1.0}
optimizer: {name: adamw, lr: 0.001, weight_decay: 1.0e-5}
training: {epochs: 5, patience: 5, gradient_clip: 1.0, checkpoint: outputs/best.pt, log_csv: outputs/train.csv}
transfer_learning:
  strategy: observation_only
  stages: [observation_only, observation_and_edge_parameters, full_finetune]
  full_finetune_lr: 1.0e-5
