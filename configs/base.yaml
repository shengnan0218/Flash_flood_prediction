model: hydrologic_lstm_graph_gate
seed: 42
runoff_mode: water_balance_lstm
routing_mode: muskingum_gnn
history_length: 72
observation_history_length: 24
forecast_horizon: 6
node_static_dim: 10
edge_static_dim: 2
hidden_dim: 32
input_preprocessing:
  rain_transform: log1p_train_standardized
  static_z_clip: 5.0
  q_history_lags_hours: [1, 3]
device: auto
gpu_id: 0
batch_size: 16
gradient_accumulation_steps: 1
amp: false
gradient_checkpointing: false
num_workers: 0
pin_memory: false
debug_mode: false
debug_max_batches: 4
data:
  mode: hunan
  dataset_type: event
  dataset_root: _model_dataset_v11_72h_event_balanced
  graph_id: null
  target_variable: Q
  strict_validation: true
  use_observation_masks: true
  future_rainfall_mode: observed_hindcast
  train_split: TRAIN
  validation_split: VALIDATION
  test_split: TEST
temporal:
  rain_history_duration_seconds: 259200
  observation_history_duration_seconds: 86400
  forecast_duration_seconds: 21600
  forcing_step_seconds: 3600
  target_step_seconds: 3600
water_balance:
  max_unobserved_loss_fraction: 0.90
  initial_unobserved_loss_fraction: 0.15
muskingum_routing:
  reference_slope_m_per_m: 0.01
  reference_velocity_mps: 0.80
  slope_velocity_exponent: 0.25
  velocity_bounds_mps: [0.15, 2.50]
  travel_time_bounds_hours: [0.625, 24.0]
  # With a fixed 1 h external step, X=0 is the stable linear-reservoir
  # special case for reaches whose effective travel time can exceed 2.5 h.
  muskingum_x: 0.0
  max_log_travel_time_adjustment: 0.35
  minimum_length_m: 10.0
  minimum_slope_m_per_m: 1.0e-6
solver:
  seconds_per_step: 3600.0
output_head:
  type: q0_anchored_route_gate
  hidden_dim: 32
  initial_gate_fraction: 0.05
stage_output:
  method: train_only_station_linear_rating
  min_unique_train_pairs: 20
loss:
  mode: q_only_high_flow
  q_scale_mode: per_station
  q_scale_floor_m3s: 1.0
  q_point_weight: 1.0
  q_high_flow_weight: 0.25
  q_volume_weight: 0.25
  high_flow_lower_quantile: 0.80
  high_flow_upper_quantile: 0.99
  high_flow_max_multiplier: 3.0
validation_selection:
  mode: station_macro_persistence_skill
optimizer: {name: adamw, lr: 0.001, weight_decay: 1.0e-5}
train_sampling:
  enabled: true
  mode: event_balanced_phase_stratified
  origins_per_event: 8
  phase_quota: 2
training:
  epochs: 30
  patience: 30
  early_stopping: false
  gradient_clip: 1.0
  checkpoint: outputs/e4_water_balance_lstm_muskingum_gnn_best.pt
  final_checkpoint: outputs/e4_water_balance_lstm_muskingum_gnn_final.pt
  log_csv: outputs/e4_water_balance_lstm_muskingum_gnn_train.csv
