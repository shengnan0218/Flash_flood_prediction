model: hydrologic_lstm_gnn_fc
seed: 42
runoff_mode: water_balance_lstm
routing_mode: kinematic_wave_gnn
history_length: 72
observation_history_length: 24
forecast_horizon: 6
node_static_dim: 10
edge_static_dim: 2
hidden_dim: 32
device: auto
gpu_id: 0
batch_size: 16
gradient_accumulation_steps: 1
amp: false
gradient_checkpointing: false
num_workers: 0
pin_memory: false
debug_mode: false
debug_max_batches: 4
data:
  mode: hunan
  dataset_type: event
  dataset_root: _model_dataset_v11_72h_event_balanced
  graph_id: null
  target_variable: Q
  strict_validation: true
  use_observation_masks: true
  future_rainfall_mode: observed_hindcast
  train_split: TRAIN
  validation_split: VALIDATION
  test_split: TEST
temporal:
  rain_history_duration_seconds: 259200
  observation_history_duration_seconds: 86400
  forecast_duration_seconds: 21600
  forcing_step_seconds: 3600
  target_step_seconds: 3600
output_head:
  type: q0_anchored_bounded_residual_mlp
  hidden_dim: 32
  max_correction_scale_fraction: 0.5
stage_output:
  method: train_only_station_linear_rating
  min_unique_train_pairs: 20
physical_bounds:
  width: [2.0, 80.0]
  manning_n: [0.015, 0.12]
solver:
  dx: 1000.0
  cfl: 0.8
  integration_scheme: backward_euler
  implicit_iterations: 8
  implicit_residual_tolerance: 1.0e-5
  minimum_slope: 1.0e-6
  minimum_length: 10.0
  seconds_per_step: 3600.0
loss:
  mode: q_only_high_flow
  q_scale_mode: per_station
  q_scale_floor_m3s: 1.0
  q_point_weight: 1.0
  q_high_flow_weight: 0.25
  q_volume_weight: 0.25
  high_flow_lower_quantile: 0.80
  high_flow_upper_quantile: 0.99
  high_flow_max_multiplier: 3.0
validation_selection:
  mode: val_loss
optimizer: {name: adamw, lr: 0.001, weight_decay: 1.0e-5}
train_sampling:
  enabled: true
  mode: event_balanced_phase_stratified
  origins_per_event: 8
  phase_quota: 2
training:
  epochs: 100
  patience: 100
  early_stopping: false
  gradient_clip: 1.0
  checkpoint: outputs/e4_best.pt
  final_checkpoint: outputs/e4_final.pt
  log_csv: outputs/e4_train.csv
