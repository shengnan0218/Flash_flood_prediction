_base_: hunan_p3_state_init_all_graphs_event_domain_rating_calibrated.yaml

# All-graph perfect-future-rainfall diagnostic.
# The ONLY scientific change relative to the all-graph calibrated baseline is
# future_rainfall_mode: observed_hindcast. This is an upper-bound / hindcast
# forcing experiment, not the operational forecast setting.
data:
  future_rainfall_mode: observed_hindcast

training:
  checkpoint: outputs/hunan_p3_state_init_all_graphs_event_domain_rating_calibrated_hindcast_best.pt
  final_checkpoint: outputs/hunan_p3_state_init_all_graphs_event_domain_rating_calibrated_hindcast_epoch100.pt
  log_csv: outputs/hunan_p3_state_init_all_graphs_event_domain_rating_calibrated_hindcast_train.csv

hyperparameter_optimization:
  enabled: false
