_base_: hunan_e4_multitask.yaml

# 严格对照：仅把Q监督误差改为TRAIN-only逐图scale，并完整运行epoch 0--99。
loss:
  q_scale_mode: per_graph
  q_scale_floor_m3s: 1.0

training:
  epochs: 100
  # Trainer在epoch开始与结束处检查stale；100可严格保证全新训练执行0--99。
  patience: 100
  checkpoint: outputs/hunan_e4_multitask_qnorm_v1_best.pt
  log_csv: outputs/hunan_e4_multitask_qnorm_v1_train.csv
