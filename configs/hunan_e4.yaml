_base_: base.yaml

# v8 hydrologic computational graph: physics forcing on Nnode, sparse Q/Z on Nobs.
runoff_mode: water_balance_lstm
routing_mode: kinematic_wave_gnn

data:
  mode: hunan
  dataset_type: continuous
  dataset_root: _model_dataset_v8_hydrologic_graph
  graph_id: null
  target_variable: BOTH
  normalize_dynamic: false
  strict_validation: true
  use_observation_masks: true
  # Preserve the agreed operational forcing contract: no observed target-period rain.
  future_rainfall_mode: persistence
  train_split: TRAIN
  validation_split: VALIDATION
  test_split: TEST

history_length: 24
forecast_horizon: 6
# v8 has no homogeneous [RAIN,Q,Z] node dynamic vector; rain is the sole forcing.
dynamic_dim: 1
node_static_dim: 10
edge_static_dim: 2
batch_size: 16
num_workers: 0
pin_memory: false
debug_mode: false

state_initialization:
  enabled: true
  mode: forecast_origin

loss_weights:
  discharge: 1.0
  water_level: 1.0

loss:
  mode: multitask
  # v8 uses TRAIN-only per-observation-station statistics from dataset_contract.json.
  q_scale_mode: per_station
  q_scale_floor_m3s: 1.0
  z_target_mode: delta_from_t0
  delta_z_scale_mode: per_station
  delta_z_scale_floor_m: 0.01
  discharge_weight: 1.0
  water_level_weight: 1.0
  q_point_weight: 1.0
  q_peak_weight: 0.25
  q_volume_weight: 0.25
  z_level_weight: 1.0
  z_slope_weight: 0.25

training:
  epochs: 100
  patience: 15
  gradient_clip: 1.0
  checkpoint: outputs/hunan_e4_v8_best.pt
  log_csv: outputs/hunan_e4_v8_train.csv
