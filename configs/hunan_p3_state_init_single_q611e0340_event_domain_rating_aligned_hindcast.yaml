_base_: hunan_p3_state_init_single_q611e0340_event_domain_rating_aligned.yaml

# Diagnostic upper-bound experiment only.
# The ONLY scientific change relative to the revised P3 config is that future
# 1-6 h observed rainfall is supplied as hindcast forcing. This is not the
# operational model setting.
data:
  future_rainfall_mode: observed_hindcast

training:
  checkpoint: outputs/hunan_p3_state_init_single_q611e0340_event_domain_rating_aligned_hindcast_best.pt
  final_checkpoint: outputs/hunan_p3_state_init_single_q611e0340_event_domain_rating_aligned_hindcast_epoch100.pt
  log_csv: outputs/hunan_p3_state_init_single_q611e0340_event_domain_rating_aligned_hindcast_train.csv

hyperparameter_optimization:
  enabled: false
