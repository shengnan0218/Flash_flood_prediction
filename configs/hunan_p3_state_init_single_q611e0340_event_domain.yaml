_base_: hunan_p3_state_init_single_q611e0340.yaml

# Single-basin event-domain probe using the continuous-hourly-dual-target-v1
# tensor contract and P3 forecast-origin state initialization. The rebuilt
# event-domain dataset must be supplied explicitly with --dataset-root so this
# config cannot silently fall back to the old full-record continuous dataset.
data:
  dataset_root: __REPLACE_WITH_EVENT_DATASET_ROOT__
  graph_id: Q_611E0340

# hydrologic_events_v1 is already an explicitly selected event-window domain.
# TRAIN therefore uses one complete pass over every retained window per epoch,
# with ordinary within-graph/batch order shuffling only.  No weighted sampling,
# no graph/event reweighting and no sampling with replacement are allowed.
# P2 full-record continuous configs retain their historical weighted sampler.
train_sampling:
  enabled: false

training:
  checkpoint: outputs/hunan_p3_state_init_single_q611e0340_event_domain_best.pt
  final_checkpoint: outputs/hunan_p3_state_init_single_q611e0340_event_domain_epoch100.pt
  log_csv: outputs/hunan_p3_state_init_single_q611e0340_event_domain_train.csv

hyperparameter_optimization:
  enabled: false
