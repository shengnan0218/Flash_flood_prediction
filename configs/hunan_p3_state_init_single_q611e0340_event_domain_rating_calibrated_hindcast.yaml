_base_: hunan_p3_state_init_single_q611e0340_event_domain_rating_calibrated.yaml

# Strict forcing diagnostic only.
# The ONLY scientific change relative to rating_calibrated is that observed
# future 1-6 h rainfall is supplied to the forecast period. This is a perfect-
# forcing / hindcast upper-bound experiment, not the operational setting.
data:
  future_rainfall_mode: observed_hindcast

training:
  checkpoint: outputs/hunan_p3_state_init_single_q611e0340_event_domain_rating_calibrated_hindcast_best.pt
  final_checkpoint: outputs/hunan_p3_state_init_single_q611e0340_event_domain_rating_calibrated_hindcast_epoch100.pt
  log_csv: outputs/hunan_p3_state_init_single_q611e0340_event_domain_rating_calibrated_hindcast_train.csv

hyperparameter_optimization:
  enabled: false
