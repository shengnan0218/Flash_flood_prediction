_base_: hunan_p3_state_init_all_graphs_event_domain_rating_calibrated.yaml

# Stable all-graph calibrated P3 after the full-domain audit.
# Runtime code now uses:
# - event-domain TRAIN full pass: every retained TRAIN window exactly once per epoch;
#   ordinary order shuffle only, no weighting and no replacement sampling;
# - TRAIN-only low-DOF monotone rating calibration from Q-quantile aggregation;
# - station-global TRAIN OLS slope for rating extrapolation outside calibrated Q range;
# - no neural Z residual head.
# All hydrologic model/loss/optimizer/LR/batch/solver settings remain inherited.
train_sampling:
  enabled: false

data:
  graph_id: null
  future_rainfall_mode: persistence

training:
  checkpoint: outputs/hunan_p3_state_init_all_graphs_event_domain_rating_calibrated_stable_best.pt
  final_checkpoint: outputs/hunan_p3_state_init_all_graphs_event_domain_rating_calibrated_stable_epoch100.pt
  log_csv: outputs/hunan_p3_state_init_all_graphs_event_domain_rating_calibrated_stable_train.csv

hyperparameter_optimization:
  enabled: false
