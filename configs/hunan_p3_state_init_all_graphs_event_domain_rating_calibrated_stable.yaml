_base_: hunan_p3_state_init_all_graphs_event_domain_rating_calibrated.yaml

# Stable all-graph calibrated P3.
# Event-domain TRAIN semantics:
# - every retained TRAIN window is visited exactly once per epoch;
# - ordinary within-graph/batch order shuffle only;
# - no weighted/replacement sampling;
# - the original graph/event/window balancing formula is retained as a
#   deterministic TRAIN-only sample_weight applied to all Q/Z loss terms.
# Thus each graph has equal total training mass, each event within a graph has
# equal total mass, and extra sliding windows only divide an event's fixed mass.
# Rating calibration remains TRAIN-only low-DOF monotone PWL with station-global
# TRAIN OLS-slope extrapolation; there is no neural Z residual head.
# All hydrologic model/optimizer/LR/batch/solver/100-epoch settings are inherited.
train_sampling:
  enabled: false

data:
  graph_id: null
  future_rainfall_mode: persistence

training:
  checkpoint: outputs/hunan_p3_state_init_all_graphs_event_domain_rating_calibrated_stable_best.pt
  final_checkpoint: outputs/hunan_p3_state_init_all_graphs_event_domain_rating_calibrated_stable_epoch100.pt
  log_csv: outputs/hunan_p3_state_init_all_graphs_event_domain_rating_calibrated_stable_train.csv

hyperparameter_optimization:
  enabled: false
