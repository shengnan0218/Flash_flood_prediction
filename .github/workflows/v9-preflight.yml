name: v9-preflight

on:
  push:
    branches:
      - main
      - agent/fix-v9-preflight
  pull_request:

jobs:
  test-v9:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile v9 entry points
        run: >-
          python -m py_compile
          models/hydrologic_graph_v9.py
          models/runoff/water_balance_v9.py
          scripts/v9_training.py
          trainers/v9_trainer.py
          metrics/v9_station_evaluation.py
          train_hunan.py
          evaluate.py
          validate_dataset.py
      - name: Run v9 and routing tests
        run: >-
          pytest -q
          tests/test_hydrologic_graph_v9.py
          tests/test_kinematic_wave_cfl.py
          tests/test_learned_channel_width.py
