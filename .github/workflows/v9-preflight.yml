name: formal-model-preflight

on:
  push:
    branches:
      - main
      - agent/v10-q-only-rating-stage
  pull_request:

jobs:
  test-formal-models:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Reject stale imports of retired P2 P3 modules
        shell: bash
        run: |
          if grep -R -n -E '(p3_consistency|p3_rating_calibrated|p2_event_evaluation|p3_rating_aligned_runtime|p3_rating_calibrated_runtime|p3_rating_calibration)' \
            --include='*.py' --include='*.md' --include='*.yaml' .; then
            echo 'Retired P2/P3 module reference remains in the active tree.' >&2
            exit 1
          fi
      - name: Import formal Python packages
        run: python -c "import datasets, losses, metrics, models, trainers"
      - name: Compile formal V10 V9 routing entry points
        run: >-
          python -m py_compile
          datasets/hydrologic_graph_v10.py
          models/hydrologic_graph_v10.py
          models/hydrologic_graph_v9.py
          models/hydrologic_graph_v9_assimilated.py
          models/runoff/water_balance_v9.py
          models/routing/kinematic_wave.py
          models/routing/kinematic_wave_optimized.py
          losses/hydrologic_graph_v10_loss.py
          scripts/v10_rating.py
          scripts/v10_training.py
          scripts/v9_training.py
          scripts/v9_active.py
          trainers/v10_trainer.py
          trainers/v9_trainer.py
          metrics/v10_station_evaluation.py
          metrics/v9_station_evaluation.py
          train_hunan.py
          evaluate.py
          validate_dataset.py
      - name: Run V10 V9 and routing tests
        run: >-
          pytest -q
          tests/test_v10_q_only_rating_stage.py
          tests/test_v10_no_future_z_leakage.py
          tests/test_v10_q_supervised_view.py
          tests/test_v10_rating_fit.py
          tests/test_v10_runtime_contract.py
          tests/test_hydrologic_graph_v9.py
          tests/test_v9_active_assimilation.py
          tests/test_v9_runtime_contract.py
          tests/test_kinematic_wave_cfl.py
          tests/test_kinematic_wave_optimized_equivalence.py
          tests/test_learned_channel_width.py
