name: hydrologic-model-ci

on:
  push:
    branches: [main, rebuild/simple-hydrologic-model]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Import packages
        run: python -c "import datasets, losses, metrics, models, trainers"
      - name: Compile supported entry points
        run: >-
          python -m py_compile
          data/hydrologic_schema.py
          datasets/hydrologic_graph.py
          models/hydrologic_model.py
          models/runoff/water_balance_continuous.py
          models/routing/muskingum.py
          models/routing/kinematic_wave.py
          models/routing/kinematic_wave_optimized.py
          losses/hydrologic_loss.py
          scripts/training.py
          trainers/hydrologic_trainer.py
          train_hunan.py
          evaluate.py
          evaluate_decomposition.py
      - name: Run tests
        run: pytest -q
